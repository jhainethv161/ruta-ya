<div class="min-h-screen bg-white flex flex-col">

  <!-- Header / Navbar -->
  <header class="px-8 py-5">
    <div class="flex items-center gap-1">
      <!-- Logo RUTAYA -->
      <span class="text-3xl font-black tracking-tight">
        <span class="text-[#1f2937]">RUT</span><span class="text-[#f59e0b]">A</span><span class="text-[#1f2937]">YA</span>
      </span>
      <!-- Pin icon -->
      <svg class="w-7 h-7 -mt-1" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#ff5757"/>
        <circle cx="12" cy="9" r="2.5" fill="white"/>
      </svg>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-sm">

      <!-- Welcome text -->
      <div class="text-center mb-8">
        <p class="text-[#1f2937] font-semibold text-lg">Bienvenido</p>
        <p class="text-[#6b7280] text-sm mt-1">Para Acceder a la App Ingresa tus datos</p>
      </div>

      <!-- Form -->
      <div class="space-y-3">

        <!-- Username -->
        <input
          type="text"
          placeholder="Nombre de Usuario"
          class="w-full px-4 py-3.5 rounded-xl border border-[#e5e7eb] text-[#1f2937] placeholder-[#9ca3af] text-sm
                 focus:outline-none focus:border-[#f59e0b] focus:ring-2 focus:ring-[#f59e0b]/20
                 transition-all duration-200 bg-white"
        />

        <!-- Password -->
        <input
          type="password"
          placeholder="Contraseña"
          class="w-full px-4 py-3.5 rounded-xl border border-[#e5e7eb] text-[#1f2937] placeholder-[#9ca3af] text-sm
                 focus:outline-none focus:border-[#f59e0b] focus:ring-2 focus:ring-[#f59e0b]/20
                 transition-all duration-200 bg-white"
        />

        <!-- Submit button -->
        <button
          type="button"
          class="w-full bg-[#f59e0b] hover:bg-[#d97706] active:bg-[#b45309]
                 text-white font-bold py-3.5 rounded-xl text-sm
                 transition-all duration-200 shadow-md hover:shadow-lg
                 transform hover:-translate-y-0.5 active:translate-y-0
                 mt-1"
        >
          Iniciar Sesión
        </button>

      </div>

      <!-- Forgot password -->
      <div class="text-center mt-5">
        <a
          href="#"
          class="text-[#6b7280] text-sm hover:text-[#f59e0b] transition-colors duration-200"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>

    </div>
  </main>

</div>
