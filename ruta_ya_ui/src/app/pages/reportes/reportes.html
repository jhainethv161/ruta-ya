<div class="flex flex-col gap-6 p-6">

  <h1 class="text-3xl font-bold text-[#1f2937] border-b-2 border-[#f59e0b] pb-4 mb-2">
    Reportes
  </h1>

  <div class="flex items-center justify-center gap-6">

    <div class="flex flex-col gap-3 flex-1 max-w-xl">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-[#1f2937]">Nombre de consulta</label>
        <select [formControl]="selectorControl"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm bg-white
                 focus:outline-none focus:ring-2 focus:ring-[#f59e0b]">
          <option value="">-- Selecciona un reporte --</option>
          @for (r of reportes; track r.id) {
            <option [value]="r.id">{{ r.nombre }}</option>
          }
        </select>
      </div>

      @if (reporteActual) {
        <div class="border-l-2 border-[#f59e0b] pl-3 flex flex-col gap-1">
          <p class="text-sm text-[#6b7280] leading-relaxed">{{ reporteActual.descripcion }}</p>
        </div>
      }
    </div>

    <div class="pt-6 w-32">
      <app-button (click)="generar()" [disabled]="!selectorControl.value">
        Generar
      </app-button>
    </div>

  </div>

</div>
